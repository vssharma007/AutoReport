[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreport"
version = "0.1.0"
description = "Automated report & analytics generator"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
pdf = ["weasyprint>=61.0"]
interactive = ["plotly>=5.20"]
schedule = ["apscheduler>=3.10"]

[project.scripts]
autoreport = "autoreport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
